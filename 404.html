<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>TOPSCAN</title>
<meta http-equiv="refresh" content="2; url=https://topscan.tech/en">
<script>
  (function () {
    var p = location.pathname.replace(/index\.html$/, "").replace(/\.html$/, "");
    if (p.length > 1) p = p.replace(/\/+$/, "");
    if (p === "" || p === "/") p = "/en";
    location.replace("https://topscan.tech" + p + location.search + location.hash);
  })();
</script>
<style>
  body{background:#14181e;color:#eef2f9;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;text-align:center}
  a{color:#f9310f}
</style>
</head>

</body>
